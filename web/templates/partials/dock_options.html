{# Options: the far right of the dock. Saved coupons for the game, where
   reserves come from, and the V6/V7 pool switch, as rows of a small
   settings table. Budget and the coupon cap come back later as more rows.
   The game dock wires it; the design lab drives it with demo state. #}
<style>
  .dko {
    position: absolute;
    inset: 0;
    container: dko / size;
    pointer-events: none;
    font-family: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
    color: var(--panel-ink, #2a2a2c);
  }
  /* A settings table: three rows to a column, title left and control
     right, hairlines between rows. Columns are at most 168px and centred
     in the section; a fourth option starts a second column. */
  .dko__board {
    position: absolute;
    inset: 0 12px;
    display: grid;
    grid-auto-flow: column;
    grid-template-rows: repeat(3, 22px);
    grid-template-columns: repeat(auto-fit, minmax(min(128px, 100%), 168px));
    justify-content: center;
    align-content: center;
    row-gap: 6px;
    column-gap: 28px;
    pointer-events: none;
  }
  .dko__cell {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    min-width: 0;
    pointer-events: auto;
  }
  .dko__cell:not(:nth-child(3n + 1))::before {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    top: -3.5px;
    height: 1px;
    background: rgba(154, 160, 168, 0.28);
    pointer-events: none;
  }
  /* The bar titles' caps, left of the control. */
  .dko__label {
    flex: none;
    font-size: 7px;
    font-weight: 700;
    letter-spacing: 0.8px;
    line-height: 1;
    text-transform: uppercase;
    white-space: nowrap;
    color: #9aa0a8;
    pointer-events: none;
  }
  .dko__ctl {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 20px;
    gap: 3px;
  }
  /* The titles' caps a size up, in the readouts' ink. */
  .dko__value {
    min-width: 5ch;
    color: #34373e;
    font-size: 8px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.8px;
    line-height: 1;
    text-align: center;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .dko__value.is-none { color: color-mix(in srgb, #34373e 45%, transparent); }

  /* Glass box with a rim, kept for open. */
  .dko__readout {
    position: relative;
    box-sizing: border-box;
    height: 16px;
    min-width: 46px;
    padding: 0 5px;
    border: 0;
    border-radius: 4px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.66), rgba(255, 255, 255, 0.36));
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    box-shadow:
      inset 0 0 0 0.5px rgba(255, 255, 255, 0.95),
      0 0 0 0.5px rgba(150, 155, 163, 0.45);
    color: #34373e;
    font: inherit;
    font-size: 8px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.8px;
    line-height: 1;
    text-transform: uppercase;
    white-space: nowrap;
    appearance: none;
  }
  .dko__readout::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.55), transparent 42%);
  }
  button.dko__readout { cursor: pointer; }
  button.dko__readout:focus-visible,
  .dko__step:focus-visible,
  .dko__bulb:focus-visible {
    outline: 1px dashed color-mix(in srgb, var(--accent-glow, #2f96d8) 70%, transparent);
    outline-offset: 1px;
  }

  /* Step arrows: the race arrows left of the monitor turned on their side,
     12 by 7, idle bulb metal and a beat of amber when pressed. The rim is a
     drop-shadow because the triangle is a clip on ::before. An arrow that
     runs out keeps its flash and fades with it. */
  .dko__step {
    position: relative;
    flex: none;
    width: 13px;
    height: 20px;
    padding: 0;
    border: 0;
    background: none;
    appearance: none;
    cursor: pointer;
    filter: drop-shadow(0 0 0.6px rgba(150, 155, 163, 0.95));
    transition: filter 0.22s ease-out, opacity 0.22s ease-out;
  }
  .dko__step::before {
    content: '';
    position: absolute;
    left: 3px;
    top: 4px;
    width: 7px;
    height: 12px;
    background: radial-gradient(circle at var(--step-cx, 67%) 50%,
      #e4e6ea 0 30%, #c9ced4 65%, #b4b9c0 100%);
  }
  .dko__step--prev::before { --step-cx: 67%; clip-path: polygon(100% 0, 100% 100%, 0 50%); }
  .dko__step--next::before { --step-cx: 33%; clip-path: polygon(0 0, 100% 50%, 0 100%); }
  .dko__step.is-flash {
    filter:
      drop-shadow(0 0 2.5px rgba(255, 173, 88, 0.9))
      drop-shadow(0 0 5px rgba(255, 139, 58, 0.42));
    transition-duration: 0.05s;
  }
  .dko__step.is-flash::before {
    background: radial-gradient(circle at var(--step-cx, 50%) 50%,
      #fff4c7 0 28%, #ffc978 60%, #f0a050 100%);
  }
  .dko__step:disabled { cursor: default; }
  .dko__step:disabled:not(.is-flash) { opacity: 0.4; }

  @container dko (max-width: 180px) {
    .dko__board { inset: 0 10px; }
    .dko__cell { gap: 4px; }
    .dko__label,
    .dko__value { letter-spacing: 0.5px; }
    .dko__ctl { gap: 1px; }
    .dko .dko__ctl--pool { padding-right: 10px; }
    .dko .dko__bulb { gap: 1px; }
    .dko__step { width: 9px; }
    .dko__step::before { left: 1px; }
  }

  /* Pool: a bulb switch, as the mode bulbs left of the hex, standing where
     the other controls have their first arrow so its value lines up. */
  .dko__ctl--pool { padding-right: 16px; }
  .dko__bulb {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 0;
    margin: 0;
    border: 0;
    background: none;
    color: inherit;
    font: inherit;
    appearance: none;
    cursor: pointer;
  }
  .dko__bulb-dot {
    flex: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 50%, transparent calc(100% - 1.6px), rgba(186, 190, 196, 0.92) calc(100% - 0.6px)),
      radial-gradient(circle at 48% 42%, #e4e6ea 0 38%, #c9ced4 62%, #b4b9c0 100%);
    transition:
      background 0.48s cubic-bezier(0.2, 0.72, 0.2, 1),
      box-shadow 0.58s cubic-bezier(0.2, 0.72, 0.2, 1);
  }
  .dko__bulb.is-on .dko__bulb-dot {
    background:
      radial-gradient(circle at 50% 50%, transparent calc(100% - 1.6px), rgba(255, 255, 255, 0.31) calc(100% - 0.6px)),
      radial-gradient(circle at 48% 42%, #fff4c7 0 22%, #ffc978 48%, #ee8b3c 76%, #9c5128 100%);
    box-shadow:
      0 0 5px rgba(255, 173, 88, 0.9),
      0 0 10px rgba(255, 139, 58, 0.42);
  }
  .dko__bulb .dko__value { transition: color 0.2s ease; }
  .dko__bulb.is-on .dko__value {
    color: var(--dk-tool-active-fill, #ffc34a);
    filter:
      drop-shadow(0 0 0.26px color-mix(in srgb, var(--dk-tool-active-glow, #ff8a14) 65%, transparent))
      drop-shadow(0 0 1.43px color-mix(in srgb, var(--dk-tool-active-glow, #ff8a14) 45%, transparent));
  }
  .dko__bulb:disabled { cursor: default; }
  .dko__bulb:disabled .dko__bulb-dot { opacity: 0.55; }
  .dko__bulb:disabled .dko__value:not(.is-none) { opacity: 0.5; }

  /* Open: a readout with the saved count. */
  .dko__open {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 0;
    border: 0;
    background: none;
    color: inherit;
    font: inherit;
    appearance: none;
    cursor: pointer;
  }
  .dko__open:focus-visible { outline: none; }
  .dko__open:focus-visible .dko__readout {
    outline: 1px dashed color-mix(in srgb, var(--accent-glow, #2f96d8) 70%, transparent);
    outline-offset: 1px;
  }
  .dko__open .dko__readout { gap: 5px; min-width: 0; }
  .dko__count {
    min-width: 12px;
    height: 11px;
    padding: 0 3px;
    box-sizing: border-box;
    border-radius: 3px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #05070d, #0a0e18);
    color: #8ee8ff;
    text-shadow: 0 0 2px rgba(120, 220, 255, 0.6);
    font-size: 8px;
  }
  .dko__open.is-empty .dko__count { color: rgba(143, 220, 236, 0.4); text-shadow: none; }
  .dko__open.is-empty .dko__readout { color: color-mix(in srgb, #34373e 55%, transparent); }
  .dko__open[aria-expanded="true"] .dko__readout {
    box-shadow:
      inset 0 0 0 0.5px rgba(255, 255, 255, 0.95),
      0 0 0 0.5px rgba(255, 173, 88, 0.7),
      0 0 5px rgba(255, 173, 88, 0.5);
  }

  /* The menu is the dock's monitor: bezel, smoked screen, ice ink. It is
     hung on the body so neither the dock nor a lab loupe clips it. */
  .dko-menu {
    position: fixed;
    z-index: 4000;
    width: 260px;
    max-width: calc(100vw - 16px);
    font-family: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
    animation: dko-menu-in 0.16s cubic-bezier(0.2, 0.72, 0.2, 1);
  }
  @keyframes dko-menu-in {
    from { opacity: 0; transform: translateY(var(--dko-menu-from, 4px)); }
    to { opacity: 1; transform: none; }
  }
  .dko-menu__bezel {
    padding: 3px;
    border: 1px solid #25292d;
    border-radius: 6px;
    background: linear-gradient(180deg, #4b5055 0%, #25292d 48%, #15181b 100%);
    box-shadow:
      0 1px 1px rgba(255, 255, 255, 0.22),
      0 6px 18px rgba(0, 0, 0, 0.32);
  }
  .dko-menu__screen {
    position: relative;
    overflow: hidden;
    border-radius: 4px;
    background: linear-gradient(180deg, #05070d, #0a0e18);
    box-shadow: inset 0 0 4px rgba(0, 0, 0, 0.72);
    color: #7fcfe0;
    text-shadow: 0 0 2px rgba(120, 220, 255, 0.6);
  }
  .dko-menu__screen::after {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      repeating-linear-gradient(180deg, rgba(0, 0, 0, 0.28) 0 1px, transparent 1px 2px),
      linear-gradient(180deg, rgba(255, 255, 255, 0.08), transparent 38%);
  }
  .dko-menu__title {
    padding: 7px 10px 5px;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.6px;
    opacity: 0.6;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .dko-menu__list {
    max-height: 232px;
    overflow-y: auto;
    padding: 0 4px 5px;
    scrollbar-width: none;
  }
  .dko-menu__list::-webkit-scrollbar { display: none; }
  .dko-menu__item {
    display: grid;
    grid-template-columns: 10px minmax(0, 1fr) auto;
    grid-template-rows: auto auto;
    column-gap: 4px;
    row-gap: 2px;
    width: 100%;
    padding: 5px 6px 5px 2px;
    border: 0;
    border-radius: 3px;
    background: none;
    color: inherit;
    font: inherit;
    text-align: left;
    text-shadow: inherit;
    cursor: pointer;
    appearance: none;
  }
  .dko-menu__item:hover,
  .dko-menu__item:focus-visible {
    outline: none;
    background: rgba(142, 232, 255, 0.08);
    color: #dcf7ff;
  }
  .dko-menu__caret {
    grid-row: 1 / 3;
    align-self: center;
    font-size: 11px;
    font-weight: 700;
    visibility: hidden;
  }
  .dko-menu__item:hover .dko-menu__caret,
  .dko-menu__item:focus-visible .dko-menu__caret,
  .dko-menu__item.is-current .dko-menu__caret { visibility: visible; }
  .dko-menu__name {
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .dko-menu__right {
    font-size: 11px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .dko-menu__sub {
    grid-column: 2 / 4;
    font-size: 9px;
    opacity: 0.6;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .dko-menu__empty {
    padding: 8px 10px 12px;
    font-size: 10px;
    opacity: 0.6;
  }
</style>
<script>
(function () {
  const CAPS = [0, 1, 2, 3, 4, 5, 6, 8, 10, 12, 15, 20, 25, 30, 40, 50];
  const RESERVES = ['rank', 'auto'];
  const STORE_KEY = 'stable-dock-options.v1';
  const HOLD_DELAY_MS = 380;
  const HOLD_REPEAT_MS = 90;

  const escHtml = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  /* Per game: { cap }. 0 is any. */
  function load(gameId) {
    try {
      const all = JSON.parse(localStorage.getItem(STORE_KEY)) || {};
      const o = (gameId && all[gameId]) || {};
      return { cap: Math.max(0, Number(o.cap) || 0) };
    } catch (_) { return { cap: 0 }; }
  }
  function save(gameId, patch) {
    if (!gameId) return load(gameId);
    let all = {};
    try { all = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (_) {}
    const next = { ...load(gameId), ...patch };
    if (!next.cap) delete all[gameId];
    else all[gameId] = next;
    try { localStorage.setItem(STORE_KEY, JSON.stringify(all)); } catch (_) {}
    window.dispatchEvent(new CustomEvent('dockoptions:changed', { detail: { gameId, ...next } }));
    return next;
  }

  /* The next rung up or down from any value, typed ones included. */
  function step(ladder, value, dir) {
    const v = Number(value) || 0;
    if (dir > 0) return ladder.find(x => x > v) ?? ladder[ladder.length - 1];
    for (let i = ladder.length - 1; i >= 0; i -= 1) if (ladder[i] < v) return ladder[i];
    return ladder[0];
  }

  function html() {
    return `<div class="dko" aria-label="coupon options">
      <div class="dko__board">
        <div class="dko__cell">
          <span class="dko__label">saved</span>
          <span class="dko__ctl">
            <button type="button" class="dko__open" data-dko-open aria-haspopup="menu" aria-expanded="false"
                    title="saved coupons on this game">
              <span class="dko__readout">open<span class="dko__count" data-dko-count>0</span></span>
            </button>
          </span>
        </div>
        <div class="dko__cell">
          <span class="dko__label">reserves</span>
          <span class="dko__ctl" data-dko-reserves>
            <button type="button" class="dko__step dko__step--prev" data-dko-step="reserves" data-dir="-1" aria-label="switch reserves source"></button>
            <span class="dko__value" data-dko-reserves-text>rank</span>
            <button type="button" class="dko__step dko__step--next" data-dko-step="reserves" data-dir="1" aria-label="switch reserves source"></button>
          </span>
        </div>
        <div class="dko__cell">
          <span class="dko__label">pool</span>
          <span class="dko__ctl dko__ctl--pool" data-dko-pool-ctl>
            <button type="button" class="dko__bulb" data-dko-pool aria-pressed="false" disabled>
              <span class="dko__bulb-dot" aria-hidden="true"></span>
              <span class="dko__value is-none" data-dko-pool-text>none</span>
            </button>
          </span>
        </div>
      </div>
    </div>`;
  }

  /* ── menu ── */
  let menu = null;
  function closeMenu(refocus) {
    if (!menu) return;
    const { el, anchor, off } = menu;
    menu = null;
    off();
    el.remove();
    anchor.setAttribute('aria-expanded', 'false');
    if (refocus) anchor.focus({ preventScroll: true });
  }

  /* spec: { title, items: [{ name, right, sub, current }], empty }. Opens
     above the anchor, or below it when there is no room. */
  function openMenu(anchor, spec, onPick) {
    closeMenu(false);
    const items = spec.items || [];
    const el = document.createElement('div');
    el.className = 'dko-menu';
    el.setAttribute('role', 'menu');
    el.innerHTML = `<div class="dko-menu__bezel"><div class="dko-menu__screen">
      ${spec.title ? `<div class="dko-menu__title">${escHtml(spec.title)}</div>` : ''}
      <div class="dko-menu__list">${items.length ? items.map((it, i) => `
        <button type="button" role="menuitem" class="dko-menu__item${it.current ? ' is-current' : ''}" data-i="${i}">
          <span class="dko-menu__caret" aria-hidden="true">›</span>
          <span class="dko-menu__name">${escHtml(it.name)}</span>
          <span class="dko-menu__right">${escHtml(it.right || '')}</span>
          <span class="dko-menu__sub">${escHtml(it.sub || '')}</span>
        </button>`).join('') : `<div class="dko-menu__empty">${escHtml(spec.empty || 'nothing saved yet')}</div>`}
      </div></div></div>`;
    document.body.appendChild(el);
    const r = anchor.getBoundingClientRect();
    const mw = el.offsetWidth;
    const mh = el.offsetHeight;
    el.style.left = `${Math.max(8, Math.min(window.innerWidth - mw - 8, r.right - mw))}px`;
    if (r.top - mh - 10 >= 8) {
      el.style.top = `${r.top - mh - 10}px`;
    } else {
      el.style.top = `${Math.min(window.innerHeight - mh - 8, r.bottom + 10)}px`;
      el.style.setProperty('--dko-menu-from', '-4px');
    }
    anchor.setAttribute('aria-expanded', 'true');
    const buttons = [...el.querySelectorAll('.dko-menu__item')];
    const onDown = (e) => {
      if (!el.contains(e.target) && !anchor.contains(e.target)) closeMenu(false);
    };
    const onKey = (e) => {
      if (e.key === 'Escape') {
        e.preventDefault();
        closeMenu(true);
        return;
      }
      const i = buttons.indexOf(document.activeElement);
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        const next = i < 0 ? 0 : (i + (e.key === 'ArrowDown' ? 1 : -1) + buttons.length) % buttons.length;
        buttons[next]?.focus();
      }
    };
    const onAway = () => closeMenu(false);
    document.addEventListener('pointerdown', onDown, true);
    document.addEventListener('keydown', onKey, true);
    window.addEventListener('resize', onAway);
    menu = {
      el,
      anchor,
      off() {
        document.removeEventListener('pointerdown', onDown, true);
        document.removeEventListener('keydown', onKey, true);
        window.removeEventListener('resize', onAway);
      },
    };
    el.addEventListener('click', (e) => {
      const btn = e.target.closest('.dko-menu__item');
      if (!btn) return;
      const item = items[Number(btn.dataset.i)];
      closeMenu(false);
      if (item && onPick) onPick(item);
    });
    (buttons[0] || null)?.focus({ preventScroll: true });
  }

  function flash(btn) {
    btn.classList.remove('is-flash');
    void btn.offsetWidth;
    btn.classList.add('is-flash');
    clearTimeout(btn._flash);
    btn._flash = setTimeout(() => btn.classList.remove('is-flash'), 140);
  }

  /* handlers: state() -> { cap, reserves: 'rank' | 'auto', saved,
     pool: null | { label, on, enabled, title }, poolNone? }; onCap(v);
     onReserves(mode); onTopOnly(on); menu() -> Promise<spec>; onOpen(item).
     Budget and the coupon cap are not on the dock for now; cap stays in
     the handler so it can come back. Pool reads none on a game without a
     pool multiplier (poolNone is its note). */
  function mount(host, handlers) {
    if (host._dko) {
      host._dko.handlers = handlers;
      host._dko.render();
      return host._dko;
    }
    host.innerHTML = html();
    const ctrl = { host, handlers };
    host._dko = ctrl;
    const q = sel => host.querySelector(sel);
    const modeOf = st => (st.reserves === 'auto' ? 'auto' : 'rank');

    ctrl.render = () => {
      const st = ctrl.handlers.state();
      const cap = q('[data-dko-cap]');
      if (cap) {
        cap.textContent = st.cap ? String(st.cap) : 'any';
        cap.classList.toggle('is-none', !st.cap);
      }
      host.querySelectorAll('[data-dko-step="cap"]').forEach(b => {
        b.disabled = Number(b.dataset.dir) < 0 ? !st.cap : st.cap >= CAPS[CAPS.length - 1];
      });
      const res = q('[data-dko-reserves]');
      if (res) {
        const mode = modeOf(st);
        q('[data-dko-reserves-text]').textContent = mode;
        res.title = mode === 'auto'
          ? 'reserves: auto — left to ATG, which takes the most played horses outside the coupon'
          : 'reserves: rank — your best-ranked horses outside the coupon';
      }
      const open = q('[data-dko-open]');
      if (open) {
        const n = Math.max(0, st.saved | 0);
        q('[data-dko-count]').textContent = String(n);
        open.classList.toggle('is-empty', !n);
      }
      const bulb = q('[data-dko-pool]');
      if (bulb) {
        const p = st.pool;
        const text = q('[data-dko-pool-text]');
        bulb.classList.toggle('is-on', !!(p && p.on));
        bulb.setAttribute('aria-pressed', p && p.on ? 'true' : 'false');
        bulb.setAttribute('aria-label', p ? `play as ${p.label}` : 'no pool multipliers');
        bulb.disabled = !p || !p.enabled;
        text.textContent = p ? p.label : 'none';
        text.classList.toggle('is-none', !p);
        // On the wrapper: a disabled button gets no hover of its own.
        q('[data-dko-pool-ctl]').title = p
          ? (p.title || '')
          : (st.poolNone || 'no pool multipliers on this game');
      }
    };

    const nudge = (btn) => {
      const st = ctrl.handlers.state();
      const dir = Number(btn.dataset.dir) || 1;
      flash(btn);
      if (btn.dataset.dkoStep === 'reserves') {
        const at = RESERVES.indexOf(modeOf(st));
        ctrl.handlers.onReserves(RESERVES[(at + dir + RESERVES.length) % RESERVES.length]);
      } else {
        const next = step(CAPS, st.cap, dir);
        if (next !== st.cap) ctrl.handlers.onCap(next);
      }
      ctrl.render();
    };
    host.querySelectorAll('[data-dko-step]').forEach(btn => {
      let delay = 0;
      let repeat = 0;
      const stop = () => {
        clearTimeout(delay);
        clearInterval(repeat);
      };
      btn.addEventListener('pointerdown', (e) => {
        if (e.button !== 0 || btn.disabled) return;
        e.preventDefault();
        stop();
        nudge(btn);
        // Holding runs the count; a two-way switch would only flicker.
        if (btn.dataset.dkoStep !== 'cap') return;
        delay = setTimeout(() => {
          repeat = setInterval(() => {
            if (btn.disabled) stop();
            else nudge(btn);
          }, HOLD_REPEAT_MS);
        }, HOLD_DELAY_MS);
      });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(name => btn.addEventListener(name, stop));
      btn.addEventListener('click', (e) => { if (e.detail === 0) nudge(btn); });
    });

    host.addEventListener('click', (e) => {
      const bulb = e.target.closest('[data-dko-pool]');
      if (!bulb || bulb.disabled) return;
      ctrl.handlers.onTopOnly(!bulb.classList.contains('is-on'));
      ctrl.render();
    });
    const open = q('[data-dko-open]');
    open?.addEventListener('click', async () => {
      if (menu && menu.anchor === open) {
        closeMenu(false);
        return;
      }
      const spec = await ctrl.handlers.menu();
      if (spec) openMenu(open, spec, item => ctrl.handlers.onOpen(item));
    });

    ctrl.render();
    return ctrl;
  }

  window.DockOptions = {
    CAPS,
    RESERVES,
    load,
    save,
    step,
    mount,
    openMenu,
    closeMenu,
  };
})();
</script>
